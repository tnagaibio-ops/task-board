<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="タスクボード">
  <title>当日タスクボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="titles">
        <h1 id="title">当日タスクボード</h1>
        <div class="sub"><span id="date"></span><span id="sync" class="sync">読み込み中…</span></div>
      </div>
      <button id="refresh" class="icon-btn" type="button" aria-label="最新の状態に更新">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
    <div class="progress" aria-live="polite">
      <div class="bar"><i id="bar"></i></div>
      <span id="pct">0 / 0 完了</span>
    </div>
    <nav class="filters" id="filters" aria-label="状況で絞り込み"></nav>
  </header>

  <div id="demo" class="banner demo" hidden>デモ表示中です（変更は保存されません）。config.js に GAS の URL を設定すると本番に接続します。</div>
  <div id="notice" class="banner notice" hidden></div>

  <main id="list" class="list" aria-live="polite"></main>

  <footer class="foot">
    <button id="who" class="who" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>
      <span id="whoName">名前を登録</span>
    </button>
    <span class="hint">完了したタスクは下に移動します</span>
  </footer>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toastMsg"></span>
    <button id="toastUndo" type="button" hidden>元に戻す</button>
  </div>

  <dialog id="dlgName" class="dlg">
    <form method="dialog" id="formName">
      <h2>あなたの名前</h2>
      <p>状況を変えたときに「誰が更新したか」として記録されます。名字だけでOKです。</p>
      <input id="inName" name="name" maxlength="20" autocomplete="nickname" placeholder="例：山田" required>
      <div class="dlg-actions">
        <button value="cancel" type="button" class="btn ghost" id="nameCancel">キャンセル</button>
        <button value="ok" class="btn primary">登録</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgKey" class="dlg">
    <form method="dialog" id="formKey">
      <h2>アクセスコード</h2>
      <p>職員から伝えられたアクセスコードを入力してください。<br>（QRコードから開いた場合は入力不要です）</p>
      <input id="inKey" name="key" maxlength="40" autocomplete="off" autocapitalize="off" inputmode="text" required>
      <p id="keyErr" class="err" hidden>コードが違います。もう一度入力してください。</p>
      <div class="dlg-actions">
        <button value="ok" class="btn primary">開く</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
